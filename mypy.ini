[mypy]
mypy_path = src:types
strict = True
check_untyped_defs = True
explicit_package_bases = True
warn_redundant_casts = True
# mutmut only supports POSIX (see the Windows guard in __main__.py), so always
# type-check against the POSIX typeshed. Without this, running mypy on Windows
# reports os.fork/os.wait/resource.setrlimit/signal.SIGXCPU as missing attributes.
platform = linux

[mypy-hammett]
ignore_missing_imports = True

[mypy-e2e_projects.*]
ignore_errors = True
